<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0712">
  <title>Fortune Rabbit — PG Soft Oficial</title>
  <link rel="icon" type="image/png" sizes="400x400" href="/SmallTile.scale-400.png">
  <link rel="stylesheet" href="/css/fortune.css">
  <link rel="stylesheet" href="/css/fortune-game.css">
</head>
<body class="game-body">

  <!-- Fundo Neon Pagoda Street de Macau/Xangai -->
  <div class="rabbit-bg-layer"></div>
  <div class="rabbit-overlay-gradient"></div>

  <!-- Top Bar com Horário e Status -->
  <header class="game-topbar">
    <div class="brand">
      <button class="back-lobby-btn" id="gameBackBtn" title="Voltar ao Lobby" onclick="window.location.href='/'">
        <i>←</i> <span>Lobby</span>
      </button>
      <span class="game-logo-text">Fortune Rabbit</span>
    </div>
    <div class="game-clock-status">
      <span id="liveClock">14:26:30</span>
      <span style="font-size:12px">📶 🔋</span>
    </div>
  </header>

  <!-- Palco Central do Jogo -->
  <main class="game-stage-rabbit">

    <!-- Banners Verticais Tradicionais Chineses nas Laterais -->
    <div class="side-banner left">
      <span>福</span>
      <span>兔</span>
      <span>迎</span>
      <span>春</span>
    </div>
    <div class="side-banner right">
      <span>吉</span>
      <span>祥</span>
      <span>如</span>
      <span>意</span>
    </div>

    <!-- Mascote Coelho 3D Animado (Casaco Vermelho e Óculos Escuros) -->
    <div class="mascot-stage">
      <div class="mascot-image-wrapper" id="mascotWrapper">
        <img id="rabbitMascotImg" src="/img/rabbit/mascot.jpg" alt="Fortune Rabbit Mascote">
        <div class="mascot-speech-bubble" id="mascotBubble">BOA SORTE!</div>
      </div>
    </div>

    <!-- Máquina de Caça-Níquel Formato Oficial 3-4-3 -->
    <div class="slot-machine-rabbit" id="slotMachine">
      
      <div class="reels-3-4-3" id="reelsContainer">
        <!-- SVG Payline Overlay para desenhar linhas de ganho elétricas -->
        <svg class="payline-svg" id="paylineSvg" viewBox="0 0 320 280"></svg>

        <!-- ROLO 1: 3 Linhas (Esquerda) -->
        <div class="reel-column" id="col-0">
          <div class="rabbit-symbol-cell" id="c0-r0"><img src="/img/rabbit/sym_ingot.jpg" alt="Ingot"></div>
          <div class="rabbit-symbol-cell" id="c0-r1"><img src="/img/rabbit/sym_carrot.jpg" alt="Carrot"></div>
          <div class="rabbit-symbol-cell" id="c0-r2"><img src="/img/rabbit/sym_wild.jpg" alt="Wild"></div>
        </div>

        <!-- ROLO 2: 4 Linhas (Coluna Central Elevada com Moldura Dourada) -->
        <div class="reel-column col-middle" id="col-1">
          <div class="rabbit-symbol-cell" id="c1-r0">
            <img src="/img/rabbit/sym_prize.jpg" alt="Prize">
            <span class="prize-note-value">250</span>
          </div>
          <div class="rabbit-symbol-cell" id="c1-r1">
            <img src="/img/rabbit/sym_prize.jpg" alt="Prize">
            <span class="prize-note-value">10</span>
          </div>
          <div class="rabbit-symbol-cell" id="c1-r2">
            <img src="/img/rabbit/sym_prize.jpg" alt="Prize">
            <span class="prize-note-value">2.50</span>
          </div>
          <div class="rabbit-symbol-cell" id="c1-r3">
            <img src="/img/rabbit/sym_prize.jpg" alt="Prize">
            <span class="prize-note-value">0.25</span>
          </div>
        </div>

        <!-- ROLO 3: 3 Linhas (Direita) -->
        <div class="reel-column" id="col-2">
          <div class="rabbit-symbol-cell" id="c2-r0"><img src="/img/rabbit/sym_wild.jpg" alt="Wild"></div>
          <div class="rabbit-symbol-cell" id="c2-r1"><img src="/img/rabbit/sym_ingot.jpg" alt="Ingot"></div>
          <div class="rabbit-symbol-cell" id="c2-r2"><img src="/img/rabbit/sym_coins.jpg" alt="Coins"></div>
        </div>
      </div>

      <!-- Faixa Dourada Animada de Notificação / Prêmio / Ganho -->
      <div class="win-ribbon-bar" id="winRibbon">
        <span id="winRibbonText">8 RODADAS DA FORTUNA COM SÍMBOLOS DE PRÊMIO NA FUNCIONALIDADE COELHO DA FORTUNA!</span>
      </div>

      <!-- Faixa de Saldo e Aposta -->
      <div class="wallet-bet-strip">
        <div class="strip-item">
          <span style="font-size:16px">👛</span>
          <div>
            <small>Saldo</small><br>
            <b id="walletDisplay">R$ 12,00</b>
          </div>
        </div>

        <div class="strip-center-logo">
          <span>PG SOFT</span>
        </div>

        <div class="strip-item" style="text-align:right">
          <div>
            <small>Aposta</small><br>
            <b id="betDisplay">R$ 0,50</b>
          </div>
          <span style="font-size:16px">🪙</span>
        </div>
      </div>

    </div>

  </main>

  <!-- Controles Inferiores (100% Idênticos aos Vídeos) -->
  <footer class="rabbit-footer-controls">
    <!-- Bubble de Aviso (Aposta Mínima) -->
    <div class="bet-toast-bubble" id="betToast">Aposta: R$ 0,50</div>

    <div class="controls-main-row">
      <!-- Cluster Esquerdo: Som e Turbo -->
      <div class="control-sub-cluster">
        <button class="circle-btn sound-btn" id="btnSound" title="Ligar/Desligar Som">🔊</button>
        <button class="circle-btn turbo-btn" id="btnTurbo" title="Modo Turbo">⚡</button>
      </div>

      <!-- Botão Central de Giro / Contador de Auto Spin -->
      <button class="spin-master-btn" id="btnMainSpin" title="Girar">
        <!-- Ícone regular de setas duplas giratórias -->
        <svg class="spin-arrows-icon" id="spinArrows" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>

        <!-- Contador numérico exibido no modo Auto (ex: 49, 48, 47...) -->
        <div class="auto-counter-badge" id="autoCounterBadge" style="display:none">
          <span id="autoCountNum">50</span>
        </div>
      </button>

      <!-- Cluster Direito: Menos, Mais e Auto Spin -->
      <div class="control-sub-cluster">
        <button class="circle-btn" id="btnMinus" title="Diminuir Aposta">−</button>
        <button class="circle-btn" id="btnPlus" title="Aumentar Aposta">+</button>
        <button class="circle-btn" id="btnOpenAuto" title="Rodadas Automáticas">🔄</button>
      </div>
    </div>
  </footer>

  <!-- Modal Seletor de Auto Spins (10, 30, 50, 80, 100) -->
  <div class="auto-modal-overlay" id="autoModal">
    <div class="auto-modal-content">
      <h3>Giro Automático</h3>
      <p style="font-size:12px;color:#94a3b8;margin-bottom:14px">Escolha a quantidade de rodadas automáticas:</p>
      <div class="auto-options-grid">
        <button class="auto-opt-btn" data-spins="10">10</button>
        <button class="auto-opt-btn" data-spins="30">30</button>
        <button class="auto-opt-btn" data-spins="50">50</button>
        <button class="auto-opt-btn" data-spins="80">80</button>
        <button class="auto-opt-btn" data-spins="100">100</button>
        <button class="auto-opt-btn" data-spins="200">200</button>
      </div>
      <button class="back-lobby-btn" style="width:100%;justify-content:center;padding:10px" onclick="document.getElementById('autoModal').style.display='none'">
        Cancelar
      </button>
    </div>
  </div>

  <!-- Big Win Modal de Celebração de Vitória Gigante -->
  <div class="big-win-overlay" id="bigWinOverlay">
    <div class="big-win-dialog">
      <div style="font-size:70px;margin-bottom:-10px">🐰🎉</div>
      <div class="big-win-title" id="bigWinTitle">GRANDE GANHO!</div>
      <div class="big-win-amount" id="bigWinAmount">R$ 0,00</div>
      <button class="back-lobby-btn" style="padding:10px 30px;background:#10b981;font-size:16px;border-color:#34d399" onclick="document.getElementById('bigWinOverlay').style.display='none'">
        COLETAR
      </button>
    </div>
  </div>

  <!-- Confetti Library & Scripts -->
  <script src="/js/confetti.browser.js"></script>
  <script src="/js/fortune-enhance.js"></script>
  <script src="/js/fortune-game.js"></script>
</body>
</html>
